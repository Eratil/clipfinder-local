name: Tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  unit-and-benchmark:
    runs-on: windows-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CLIPFINDER_DATA_DIR: "${{ runner.temp }}/clipfinder-test-data"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Unit and synthetic benchmark tests
        run: python -m pytest --cov=app.services.benchmark --cov=app.services.tagging --cov=app.services.discovery --cov-report=term-missing
      - name: Evaluate synthetic benchmark
        run: python scripts/evaluate_benchmark.py tests/fixtures/benchmark-smoke.jsonl
